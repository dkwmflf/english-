<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영단어 학습 카드 - 관리자 모드 탑재</title>
  <style>
    :root {
      /* 기본 메인 테마 색상 (청록색 계열) */
      --main-color: #00a896;
      --main-dark: #00796b;
      --main-light: #e6f4f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fcfcfc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 20px 40px 20px;
    }

    .top-bar {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .top-btn {
      background-color: #f0f0f0;
      color: #333;
      border: 1px solid #ccc;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .edit-btn {
      background-color: var(--main-color);
      color: white;
      border: none;
    }

    .chapter-bar {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--main-light);
      padding: 10px 16px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .chapter-info {
      font-weight: 700;
      color: var(--main-dark);
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .progress-info {
      display: flex;
      gap: 10px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .round-text { color: #d9534f; font-weight: 700; }
    .progress-text { color: #555; }
    .known-text { color: var(--main-color); font-weight: 700; }

    .card-container {
      width: 100%;
      max-width: 420px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
    }

    .word-text {
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--main-color);
      text-align: center;
      word-break: break-word;
      margin-bottom: 20px;
    }

    .meaning-box {
      font-size: 1.4rem;
      font-weight: 600;
      color: #333;
      text-align: center;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      padding: 12px;
      background-color: var(--main-light);
      border-radius: 12px;
      width: 100%;
    }

    .meaning-box.show {
      visibility: visible;
    }

    .buttons-container {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .btn {
      height: 65px;
      border: none;
      border-radius: 35px;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 6px 0px rgba(0,0,0,0.15);
      transition: transform 0.1s;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0px rgba(0,0,0,0.15);
    }

    .btn-dark { background-color: #333337; }
    .btn-teal { background-color: var(--main-color); }

    /* 모달 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-content {
      background: white;
      padding: 24px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      max-height: 85vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chapter-list-item {
      padding: 14px;
      border-radius: 12px;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-weight: bold;
    }

    .chapter-list-item.random-item {
      background: #fff3bf;
      border: 1px solid #fcc419;
      color: #d9480f;
    }

    .chapter-list-item.locked {
      background: #f1f3f5;
      color: #adb5bd;
      cursor: not-allowed;
    }

    .chapter-list-item.active {
      border: 2px solid var(--main-color);
      background: var(--main-light);
      color: var(--main-dark);
    }

    /* 관리자 모드 섹션 */
    .admin-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 2px dashed #ddd;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .admin-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #555;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .admin-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8f9fa;
      padding: 10px 12px;
      border-radius: 10px;
    }

    .admin-label {
      font-size: 0.85rem;
      font-weight: bold;
      color: #333;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-picker-input {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      width: 32px;
      height: 32px;
      background-color: transparent;
      border: none;
      cursor: pointer;
    }

    .color-picker-input::-webkit-color-swatch {
      border-radius: 50%;
      border: 2px solid #ddd;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .modal-btn {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .save-btn { background-color: var(--main-color); color: white; }
    .cancel-btn { background-color: #ccc; color: #333; }
    .select-field { padding: 6px 10px; border-radius: 8px; border: 1px solid #ccc; font-weight: bold; }
    .input-field { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 1rem; }
  </style>
</head>
<body>

  <!-- 상단 버튼 -->
  <div class="top-bar">
    <button class="top-btn" onclick="resetChapter()">
      <span>↺</span> 다시 학습
    </button>
    <button class="top-btn edit-btn" onclick="openEditModal()">
      <span>✎</span> [편집]
    </button>
  </div>

  <!-- 챕터 및 진행률 바 -->
  <div class="chapter-bar">
    <div class="chapter-info" onclick="openChapterModal()" id="chapterTitle">
      제 1장 ▾
    </div>
    <div class="progress-info">
      <span class="round-text" id="roundText">1회차</span>
      <span class="progress-text" id="progressText">1 / 20</span>
      <span class="known-text" id="knownText">완료: 0/20</span>
    </div>
  </div>

  <!-- 카드 구역 -->
  <div class="card-container">
    <div class="word-text" id="wordText">precision</div>
    <div class="meaning-box" id="meaningText">정확성</div>
  </div>

  <!-- 하단 버튼 -->
  <div class="buttons-container">
    <button class="btn btn-dark" style="grid-column: span 2;" onclick="toggleMeaning()">
      <span>ㅎ</span> 한국어
    </button>
    <button class="btn btn-teal" onclick="handleStudy()">
      <span>?</span> 공부하겠음
    </button>
    <button class="btn btn-teal" onclick="handleKnow()">
      <span>✓</span> 알고있음
    </button>
  </div>

  <!-- 챕터 선택 모달 -->
  <div class="modal" id="chapterModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 5px;">챕터 선택</h3>
      <div id="chapterList" style="display: flex; flex-direction: column; gap: 8px;"></div>
      
      <!-- 관리자 모드 -->
      <div class="admin-section">
        <div class="admin-title">🛠️ 관리자 모드</div>
        
        <!-- 1. 건너뛰기 -->
        <div class="admin-row">
          <span class="admin-label">🔓 챕터 잠금 해제</span>
          <select id="unlockSelect" class="select-field" onchange="handleAdminUnlock(this.value)">
            <option value="">선택</option>
          </select>
        </div>

        <!-- 2. 색상 변경 -->
        <div class="admin-row">
          <span class="admin-label">🎨 테마 색상 변경</span>
          <div class="color-picker-wrapper">
            <input type="color" id="themeColorPicker" class="color-picker-input" value="#00a896" onchange="changeThemeColor(this.value)">
          </div>
        </div>
      </div>

      <div class="modal-buttons">
        <button class="modal-btn cancel-btn" onclick="closeChapterModal()">닫기</button>
      </div>
    </div>
  </div>

  <!-- 편집 모달 -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h3>현재 단어 수정</h3>
      <label>영단어</label>
      <input type="text" id="editEn" class="input-field">
      <label>한국어 뜻</label>
      <input type="text" id="editKo" class="input-field">
      <div class="modal-buttons">
        <button class="modal-btn cancel-btn" onclick="closeEditModal()">취소</button>
        <button class="modal-btn save-btn" onclick="saveCurrentWord()">저장</button>
      </div>
    </div>
  </div>

  <script>
    const rawWordList = [
      { en: "precision", ko: "정확성" },
      { en: "determinacy", ko: "확정성, 결정성" },
      { en: "requirement", ko: "필요조건" },
      { en: "to a large extent", ko: "상당히, 상당 부분" },
      { en: "ongoing", ko: "계속 진행 중인" },
      { en: "representation", ko: "진술, 설명, 표현" },
      { en: "put a premium on", ko: "~을 중시(장려)하다" },
      { en: "hence", ko: "그러므로, 이에 따라" },
      { en: "refinement", ko: "정제, 정련" },
      { en: "varied", ko: "다양한" },
      { en: "insight", ko: "통찰(력)" },
      { en: "approximation", ko: "접근, 근접, 근사" },
      { en: "unmask", ko: "들추어내다, ~의 가면을 벗기다" },
      { en: "illusion", ko: "환상, 착각" },
      { en: "alternative", ko: "대안적인, 대안의" },
      { en: "indeed", ko: "진정, 참으로" },
      { en: "criterion (pl. criteria)", ko: "기준, 척도" },
      { en: "seemingly", ko: "겉으로는, 보기에는" },
      { en: "coexistence", ko: "공존" },
      { en: "reliability", ko: "신뢰성" },
      { en: "contemporary", ko: "현대의, 당대의" },
      { en: "employ", ko: "(수단으로) 사용하다" },
      { en: "make reference to", ko: "~를 언급하다, 참조하다" },
      { en: "abstractionist", ko: "추상화가" },
      { en: "concerned about", ko: "~에 신경 쓰느, 관심 있는" },
      { en: "extensive", ko: "광범위한" },
      { en: "marked", ko: "뚜렷한" },
      { en: "contrast", ko: "대조" },
      { en: "decade", ko: "10년" },
      { en: "utilize", ko: "활용하다" },
      { en: "disapprovingly", ko: "불만스러운 듯이, 탐탁지 않은 뉘앙스로" },
      { en: "generation", ko: "세대" },
      { en: "appropriately", ko: "적절하게" },
      { en: "integrated", ko: "통합된" },
      { en: "portable", ko: "휴대용의, 이동식의" },
      { en: "surpass", ko: "능가하다" },
      { en: "resemble", ko: "닮다" },
      { en: "bulky", ko: "부피가 (너무) 큰" },
      { en: "distinct", ko: "독특한, 별개의" },
      { en: "extinct", ko: "멸종한" },
      { en: "constructive", ko: "건설적인" },
      { en: "destructive", ko: "파괴적인" },
      { en: "expand", ko: "확장하다" },
      { en: "prediction", ko: "예측" },
      { en: "existence", ko: "존재" },
      { en: "accordingly", ko: "그에 맞춰" },
      { en: "embrace", ko: "수용하다" },
      { en: "destroy", ko: "파괴하다" },
      { en: "add A to B", ko: "A를 B에 추가하다, 더하다" },
      { en: "build upon", ko: "~을 기반으로 하다" },
      { en: "foster", ko: "촉진하다" },
      { en: "draw upon", ko: "~을 이용하다" },
      { en: "ever-evolving", ko: "계속 진화하는" },
      { en: "replace", ko: "교체하다, 대체하다" },
      { en: "analyze", ko: "분석하다" },
      { en: "spontaneously", ko: "저절로" },
      { en: "unambiguously", ko: "분명히 (↔ 모호하게 ambiguously)" },
      { en: "slightly", ko: "약간" },
      { en: "natural selection", ko: "[진화] 자연 선택" },
      { en: "get rid of", ko: "~를 제거하다, 없애다" },
      { en: "conversely", ko: "반대로" },
      { en: "strike ~ down", ko: "~의 목숨을 앗아가다, ~를 쓰러뜨리다" },
      { en: "reasonably", ko: "마땅히, 합리적으로" },
      { en: "promptly", ko: "신속하게, 재빨리" },
      { en: "A outcompete B", ko: "A가 (경쟁에서) B보다 우세하다" },
      { en: "fortunate", ko: "운이 좋은" },
      { en: "reproductive", ko: "번식의, 번식이 가능한" },
      { en: "accumulate", ko: "축적되다, 누적되다" },
      { en: "so long as (=as long as)", ko: "~하는 한" },
      { en: "operate", ko: "기능하다, 작용하다" },
      { en: "suppress", ko: "막다, 억누르다" },
      { en: "compensate for", ko: "~를 상쇄하다" },
      { en: "reproduce", ko: "번식하다" },
      { en: "unprecedented", ko: "전례 없는" },
      { en: "disruption", ko: "혼란, 붕괴" },
      { en: "acceleration", ko: "가속도, 촉진" },
      { en: "profound", ko: "심오한, 엄청난" },
      { en: "implication", ko: "영향, 함의" },
      { en: "sustainability", ko: "지속 가능성" },
      { en: "inequality", ko: "불평등" },
      { en: "vulnerable", ko: "취약한" },
      { en: "resilience", ko: "회복력" },
      { en: "mitigate", ko: "완화하다" },
      { en: "adaptation", ko: "적응" },
      { en: "implementation", ko: "이행, 실행" },
      { en: "comprehensive", ko: "포괄적인" },
      { en: "collaboration", ko: "협력" },
      { en: "stakeholder", ko: "이해관계자" },
      { en: "perspective", ko: "관점, 시각" },
      { en: "transition", ko: "전환, 변이" },
      { en: "innovation", ko: "혁신" },
      { en: "infrastructure", ko: "기반 시설, 인프라" },
      { en: "allocation", ko: "할당, 배분" },
      { en: "resource", ko: "자원" },
      { en: "efficiency", ko: "효율성" },
      { en: "consumption", ko: "소비" },
      { en: "footprint", ko: "발자국, 영향" },
      { en: "renewable", ko: "재생 가능한" }
    ];

    let currentChapter = 1;
    let unlockedChapter = 1;
    
    let totalTargetWords = [];
    let activeQueue = [];
    let nextQueue = [];
    
    let currentIndex = 0;
    let roundCount = 1;
    let clearedCount = 0;
    let isMeaningShown = false;

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function initChapter(chap) {
      currentChapter = chap;

      if (chap === 'random') {
        const shuffledAll = shuffleArray(rawWordList);
        const sampleSize = Math.min(5, rawWordList.length);
        totalTargetWords = JSON.parse(JSON.stringify(shuffledAll.slice(0, sampleSize)));
      } else {
        const count = Math.min(chap * 20, rawWordList.length);
        totalTargetWords = JSON.parse(JSON.stringify(rawWordList.slice(0, count)));
      }
      
      activeQueue = [...totalTargetWords];
      nextQueue = [];
      
      currentIndex = 0;
      roundCount = 1;
      clearedCount = 0;
      
      updateCard();
    }

    function updateCard() {
      const current = activeQueue[currentIndex];
      const totalCount = totalTargetWords.length;
      
      if (currentChapter === 'random') {
        document.getElementById('chapterTitle').innerHTML = `🎲 무작위장 (5개) ▾`;
      } else {
        document.getElementById('chapterTitle').innerHTML = `제 ${currentChapter}장 (No.1~${totalCount}) ▾`;
      }

      document.getElementById('wordText').textContent = current.en;
      document.getElementById('meaningText').textContent = current.ko;
      
      document.getElementById('roundText').textContent = `${roundCount}회차`;
      document.getElementById('progressText').textContent = `${currentIndex + 1} / ${activeQueue.length}`;
      document.getElementById('knownText').textContent = `완료: ${clearedCount}/${totalCount}`;
      
      isMeaningShown = false;
      document.getElementById('meaningText').classList.remove('show');
    }

    function toggleMeaning() {
      isMeaningShown = !isMeaningShown;
      const meaningBox = document.getElementById('meaningText');
      if (isMeaningShown) {
        meaningBox.classList.add('show');
      } else {
        meaningBox.classList.remove('show');
      }
    }

    function handleKnow() {
      clearedCount++;
      nextCard();
    }

    function handleStudy() {
      nextQueue.push(activeQueue[currentIndex]);
      nextCard();
    }

    function nextCard() {
      if (currentIndex < activeQueue.length - 1) {
        currentIndex++;
        updateCard();
      } else {
        if (nextQueue.length === 0) {
          if (currentChapter === 'random') {
            alert(`🎉 무작위 5개 단어를 완벽히 클리어 하셨습니다! (${roundCount}회차 진행)\n새로운 무작위 5개 단어로 시작합니다.`);
            initChapter('random');
          } else {
            alert(`🎉 축하합니다! 제 ${currentChapter}장의 모든 단어(${totalTargetWords.length}개)를 완전 클리어 하셨습니다! (${roundCount}회차 진행)`);
            
            if (currentChapter === unlockedChapter && (currentChapter * 20) < rawWordList.length) {
              unlockedChapter++;
            }
            
            if ((currentChapter * 20) < rawWordList.length) {
              if (confirm(`다음 제 ${currentChapter + 1}장을 시작하시겠습니까?`)) {
                initChapter(currentChapter + 1);
              } else {
                initChapter(currentChapter);
              }
            } else {
              alert("모든 챕터를 완벽히 수료하셨습니다!");
              initChapter(currentChapter);
            }
          }
        } else {
          alert(`↻ ${roundCount}회차가 끝났습니다!\n아직 남은 단어 ${nextQueue.length}개를 무작위로 섞어서 ${roundCount + 1}회차를 시작합니다.`);
          activeQueue = shuffleArray(nextQueue);
          nextQueue = [];
          currentIndex = 0;
          roundCount++;
          updateCard();
        }
      }
    }

    function resetChapter() {
      const titleName = currentChapter === 'random' ? '무작위장' : `제 ${currentChapter}장`;
      if (confirm(`${titleName}을(를) 처음부터 다시 시작하시겠습니까?`)) {
        initChapter(currentChapter);
      }
    }

    /* 챕터 모달 */
    function openChapterModal() {
      const listContainer = document.getElementById('chapterList');
      listContainer.innerHTML = '';

      // 무작위장
      const randomItem = document.createElement('div');
      const isRandomActive = currentChapter === 'random';
      randomItem.className = `chapter-list-item random-item ${isRandomActive ? 'active' : ''}`;
      randomItem.innerHTML = `
        <span>🎲 무작위장 (전체 단어 중 5개)</span>
        <span>${isRandomActive ? '학습중' : '선택'}</span>
      `;
      randomItem.onclick = () => {
        initChapter('random');
        closeChapterModal();
      };
      listContainer.appendChild(randomItem);

      // 일반 챕터
      const totalChapters = Math.ceil(rawWordList.length / 20);

      // 잠금 해제 드롭다운 옵션 채우기
      const unlockSelect = document.getElementById('unlockSelect');
      unlockSelect.innerHTML = '<option value="">선택</option>';

      for (let i = 1; i <= totalChapters; i++) {
        const count = Math.min(i * 20, rawWordList.length);
        const item = document.createElement('div');
        const isLocked = i > unlockedChapter;
        const isActive = i === currentChapter;

        item.className = `chapter-list-item ${isLocked ? 'locked' : ''} ${isActive ? 'active' : ''}`;
        item.innerHTML = `
          <span>제 ${i}장 (No.1~${count})</span>
          <span>${isLocked ? '🔒 잠김' : (isActive ? '학습중' : '선택')}</span>
        `;

        if (!isLocked) {
          item.onclick = () => {
            initChapter(i);
            closeChapterModal();
          };
        }

        listContainer.appendChild(item);

        // 건너뛰기 드롭다운 옵션 추가
        const option = document.createElement('option');
        option.value = i;
        option.textContent = `제 ${i}장까지 해제`;
        unlockSelect.appendChild(option);
      }

      document.getElementById('chapterModal').style.display = 'flex';
    }

    function closeChapterModal() {
      document.getElementById('chapterModal').style.display = 'none';
    }

    /* 관리자: 잠금 해제 처리 */
    function handleAdminUnlock(targetChap) {
      if (!targetChap) return;
      unlockedChapter = parseInt(targetChap);
      alert(`🔓 제 1장부터 제 ${unlockedChapter}장까지 잠금이 해제되었습니다!`);
      openChapterModal(); // 목록 새로고침
    }

    /* 관리자: 색상 변경 처리 */
    function changeThemeColor(hexColor) {
      // Hex를 RGB로 변환하여 보조 색상(Dark/Light) 계산
      const r = parseInt(hexColor.substr(1,2), 16);
      const g = parseInt(hexColor.substr(3,2), 16);
      const b = parseInt(hexColor.substr(5,2), 16);

      // 조금 더 어두운 색상 (Dark)
      const darkR = Math.max(0, Math.floor(r * 0.7));
      const darkG = Math.max(0, Math.floor(g * 0.7));
      const darkB = Math.max(0, Math.floor(b * 0.7));
      const darkHex = `rgb(${darkR}, ${darkG}, ${darkB})`;

      // 밝은 배경 색상 (Light - 연한 파스텔조)
      const lightHex = `rgba(${r}, ${g}, ${b}, 0.12)`;

      // CSS 변수 적용
      document.documentElement.style.setProperty('--main-color', hexColor);
      document.documentElement.style.setProperty('--main-dark', darkHex);
      document.documentElement.style.setProperty('--main-light', lightHex);
    }

    /* 편집 모달 */
    function openEditModal() {
      const current = activeQueue[currentIndex];
      document.getElementById('editEn').value = current.en;
      document.getElementById('editKo').value = current.ko;
      document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    function saveCurrentWord() {
      const newEn = document.getElementById('editEn').value;
      const newKo = document.getElementById('editKo').value;
      
      activeQueue[currentIndex].en = newEn;
      activeQueue[currentIndex].ko = newKo;
      
      updateCard();
      closeEditModal();
    }

    // 최초 실행 (1장)
    initChapter(1);
  </script>
</body>
</html>
