
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영단어 학습 카드</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fcfcfc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px 20px 40px 20px;
    }

    .top-bar {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .progress-text {
      font-size: 1rem;
      font-weight: 600;
      color: #777;
    }

    .edit-btn {
      background-color: #00a896;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .card-container {
      width: 100%;
      max-width: 420px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
    }

    .word-text {
      font-size: 2.8rem;
      font-weight: 700;
      color: #009688;
      text-align: center;
      word-break: break-word;
      margin-bottom: 20px;
    }

    .meaning-box {
      font-size: 1.5rem;
      font-weight: 600;
      color: #333;
      text-align: center;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      padding: 10px;
      background-color: #f0f7f6;
      border-radius: 12px;
      width: 100%;
    }

    .meaning-box.show {
      visibility: visible;
    }

    .buttons-container {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .btn {
      height: 65px;
      border: none;
      border-radius: 35px;
      font-size: 1.25rem;
      font-weight: bold;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 6px 0px rgba(0,0,0,0.15);
      transition: transform 0.1s;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0px rgba(0,0,0,0.15);
    }

    .btn-dark {
      background-color: #333337;
    }

    .btn-teal {
      background-color: #00a896;
    }

    /* Modal for Editing */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-content {
      background: white;
      padding: 24px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-content h3 {
      color: #333;
      font-size: 1.3rem;
    }

    .modal-content input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 1rem;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .save-btn { background-color: #00a896; color: white; }
    .cancel-btn { background-color: #ccc; color: #333; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="progress-text" id="progressText">1 / 201</div>
    <button class="edit-btn" onclick="openEditModal()">[편집]</button>
  </div>

  <div class="card-container">
    <div class="word-text" id="wordText">precision</div>
    <div class="meaning-box" id="meaningText">정확성</div>
  </div>

  <div class="buttons-container">
    <button class="btn btn-dark" onclick="toggleMeaning()">
      <span>ㅎ</span> 한국어
    </button>
    <button class="btn btn-dark" onclick="resetCard()">

    </button>
    <button class="btn btn-teal" onclick="nextCard()">
      <span>?</span> 공부하겠음
    </button>
    <button class="btn btn-teal" onclick="nextCard()">
      <span>✓</span> 알고있음
    </button>
  </div>

      <div class="modal-buttons">
        <button class="modal-btn cancel-btn" onclick="closeEditModal()">취소</button>
        <button class="modal-btn save-btn" onclick="saveCurrentWord()">저장</button>
      </div>
    </div>
  </div>

    let currentIndex = 0;
    let isMeaningShown = false;

    function updateCard() {
      const current = wordList[currentIndex];
      document.getElementById('wordText').textContent = current.en;
      document.getElementById('meaningText').textContent = current.ko;
      document.getElementById('progressText').textContent = `${currentIndex + 1} / ${wordList.length}`;
      
      isMeaningShown = false;
      document.getElementById('meaningText').classList.remove('show');
    }

    function toggleMeaning() {
      isMeaningShown = !isMeaningShown;
      const meaningBox = document.getElementById('meaningText');
      if (isMeaningShown) {
        meaningBox.classList.add('show');
      } else {
        meaningBox.classList.remove('show');
      }
    }

    function nextCard() {
      if (currentIndex < wordList.length - 1) {
        currentIndex++;
        updateCard();
      } else {
        alert("모든 단어(201개)를 학습하셨습니다!");
        currentIndex = 0;
        updateCard();
      }
    }

    function resetCard() {
      currentIndex = 0;
      updateCard();
    }

    function openEditModal() {
      const current = wordList[currentIndex];
      document.getElementById('editEn').value = current.en;
      document.getElementById('editKo').value = current.ko;
      document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    function saveCurrentWord() {
      const newEn = document.getElementById('editEn').value;
      const newKo = document.getElementById('editKo').value;
      
      wordList[currentIndex].en = newEn;
      wordList[currentIndex].ko = newKo;
      
      updateCard();
      closeEditModal();
    }

    updateCard();
